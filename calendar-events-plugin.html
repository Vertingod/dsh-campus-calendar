<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学期事件月历</title>
<style>
  :root {
    --ink: #1d2430;
    --muted: #5d6a7c;
    --line: #d9dfe8;
    --paper: #f6f7f9;
    --white: #ffffff;
    --l1: #eef4fb;      /* 一般事件 */
    --l2: #cfe1f5;      /* 考试 / 提交 */
    --l3: #f6d9b6;      /* 比赛日 */
    --l4: #f3b6a8;      /* 报名截止：最深 */
    --l4-ink: #7c2318;
    --accent: #1f6feb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px;
  }
  .shell {
    max-width: 1080px; margin: 0 auto; display: grid;
    grid-template-columns: minmax(0, 1fr) 320px; gap: 20px;
    align-items: start;
  }
  @media (max-width: 860px) { .shell { grid-template-columns: 1fr; } body { padding: 12px; } }

  .card {
    background: var(--white); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px;
  }

  /* ---------- 头部：年月 + 翻动 ---------- */
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .head h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .5px; }
  .head .spacer { flex: 1; }
  .nav-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--white); color: var(--ink); cursor: pointer; font-size: 15px;
  }
  .nav-btn:hover { background: var(--paper); }
  .nav-btn:focus-visible, .day:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .today-btn {
    height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--white); cursor: pointer;
  }

  /* ---------- 网格 ---------- */
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .weekdays span {
    text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0 8px;
  }
  .weekdays .weekend { color: #b5533f; }
  .day {
    position: relative; min-height: 74px; padding: 6px 7px 8px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--white);
    text-align: left; cursor: pointer; font: inherit; color: var(--ink);
    display: flex; flex-direction: column; gap: 3px;
    transition: box-shadow .12s ease, transform .12s ease;
  }
  .day:hover { box-shadow: 0 2px 8px rgba(29, 36, 48, .12); }
  .day.outside { opacity: .45; }
  .day.today .num {
    background: var(--accent); color: #fff; border-radius: 999px;
    width: 22px; height: 22px; display: inline-grid; place-items: center;
  }
  .day.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(31,111,235,.25); }
  .day .num { font-size: 13px; font-weight: 600; }
  /* 重要等级：越重要底色越深 */
  .day[data-level="4"] { background: var(--l4); border-color: #e09a8a; color: var(--l4-ink); }
  .day[data-level="3"] { background: var(--l3); border-color: #e0bb8a; }
  .day[data-level="2"] { background: var(--l2); border-color: #a9c8e6; }
  .day[data-level="1"] { background: var(--l1); }
  .marks { display: flex; flex-wrap: wrap; gap: 3px; }
  .mark {
    font-size: 11px; line-height: 1.35; padding: 0 4px; border-radius: 4px;
    background: rgba(255,255,255,.72); max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .more { font-size: 11px; color: var(--muted); }

  /* ---------- 图例 ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.12); }

  /* ---------- 详情面板 ---------- */
  .detail-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .detail-head h2 { font-size: 15px; margin: 0; }
  .detail-head .sub { color: var(--muted); font-size: 12px; }
  .detail-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .ev { border-left: 4px solid var(--line); padding: 8px 10px; background: var(--paper); border-radius: 0 8px 8px 0; }
  .ev[data-level="4"] { border-color: #d3684f; }
  .ev[data-level="3"] { border-color: #d99a4e; }
  .ev[data-level="2"] { border-color: #5f9bd6; }
  .ev[data-level="1"] { border-color: #9fb6cf; }
  .ev strong { display: block; font-size: 13.5px; }
  .ev .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ev p { margin: 6px 0 0; white-space: pre-wrap; }
  .empty { color: var(--muted); text-align: center; padding: 28px 8px; }

  /* ---------- 表单 ---------- */
  details.add { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 12px; }
  details.add summary { cursor: pointer; font-weight: 600; }
  form { display: grid; gap: 8px; margin-top: 10px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select, textarea {
    font: inherit; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px; background: var(--white); width: 100%;
  }
  textarea { resize: vertical; min-height: 56px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .primary {
    justify-self: start; padding: 7px 16px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; cursor: pointer; font: inherit;
  }
  .danger { background: none; border: 1px solid var(--line); color: #a23b2a; border-radius: 6px; cursor: pointer; font-size: 12px; padding: 2px 8px; }
  .ev-foot { margin-top: 6px; display: flex; justify-content: flex-end; }
  .hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="shell">
  <!-- 左侧：月历 -->
  <section class="card" aria-label="月历">
    <div class="head">
      <h1 id="title">—</h1>
      <span class="spacer"></span>
      <button class="nav-btn" id="prev" aria-label="上个月">‹</button>
      <button class="today-btn" id="today">今天</button>
      <button class="nav-btn" id="next" aria-label="下个月">›</button>
    </div>
    <div class="weekdays" id="weekdays"></div>
    <div class="grid" id="grid"></div>
    <div class="legend" id="legend"></div>
  </section>

  <!-- 右侧：当日详情 + 新增 -->
  <section class="card" aria-label="当日事件">
    <div class="detail-head">
      <h2 id="detail-date">今天</h2>
      <span class="sub" id="detail-count"></span>
    </div>
    <ul class="detail-list" id="detail-list"></ul>
    <div class="empty" id="detail-empty">这一天没有特殊事件。</div>

    <details class="add">
      <summary>新增事件</summary>
      <form id="form" autocomplete="off">
        <label>日期 <input type="date" name="date" id="f-date" required></label>
        <label>标题 <input name="title" maxlength="80" required placeholder="如：蓝桥杯省赛报名截止"></label>
        <div class="row2">
          <label>类型
            <select name="type" id="f-type"></select>
          </label>
          <label>重要等级
            <select name="level" id="f-level">
              <option value="1">1 · 一般</option>
              <option value="2">2 · 需准备</option>
              <option value="3">3 · 比赛日</option>
              <option value="4">4 · 报名截止</option>
            </select>
          </label>
        </div>
        <label>描述 <textarea name="desc" maxlength="300" placeholder="地点、报名方式、需要带的材料…"></textarea></label>
        <button class="primary" type="submit">保存事件</button>
        <span class="hint" id="form-hint"></span>
      </form>
    </details>
  </section>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
   * 1. 数据层：事件类型 → 等级/颜色，存储适配层（localStorage 可整体替换）
   * ===================================================================== */
  const TYPES = {
    deadline: { label: '报名截止', level: 4, color: 'var(--l4)' },
    match:    { label: '比赛日',   level: 3, color: 'var(--l3)' },
    exam:     { label: '考试 / 提交', level: 2, color: 'var(--l2)' },
    other:    { label: '一般事项', level: 1, color: 'var(--l1)' }
  };
  const LEVEL_TEXT = { 1: '一般', 2: '需准备', 3: '比赛日', 4: '报名截止' };
  const WEEKDAYS = ['一', '二', '三', '四', '五', '六', '日'];

  const STORAGE_KEY = 'semester-calendar.events.v1';

  /** 存储适配层：换成 IndexedDB / 后端 API 时只改这三个方法。 */
  const Storage = {
    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        return Array.isArray(data.events) ? data.events : null;
      } catch (err) {
        console.warn('[calendar] 读取本地数据失败，将使用示例数据', err);
        return null;
      }
    },
    save(events) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, savedAt: new Date().toISOString(), events }));
        return true;
      } catch (err) {
        console.warn('[calendar] 保存失败（可能是隐私模式或空间已满）', err);
        return false;
      }
    },
    clear() { localStorage.removeItem(STORAGE_KEY); }
  };

  /**
   * 事件模型
   * @typedef {{ id: string, date: string, title: string, type: keyof TYPES,
   *             level: 1|2|3|4, desc: string, createdAt: string }} EventItem
   * date 一律为本地日期字符串 YYYY-MM-DD（不存时间戳，避免时区把日期挪一天）。
   */

  function uid() {
    return 'ev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  }

  function isoDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function parseIso(iso) {
    const [y, m, d] = String(iso).split('-').map(Number);
    return new Date(y, (m || 1) - 1, d || 1);
  }

  /** 示例数据：首次打开时以「本周/本月」为基准生成，让用户立刻有东西可点。 */
  function sampleEvents() {
    const base = new Date();
    const shift = days => {
      const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + days);
      return isoDate(d);
    };
    const now = new Date().toISOString();
    const make = (date, title, type, desc) => ({
      id: uid(), date, title, type, level: TYPES[type].level, desc, createdAt: now, sample: true
    });
    return [
      make(shift(3),  '示例 · 比赛报名截止', 'deadline', '示例数据，可在右侧「新增事件」里改。深色底表示最重要。'),
      make(shift(9),  '示例 · 校园赛比赛日', 'match',    '地点：体育馆。示例数据。'),
      make(shift(14), '示例 · 英语期中考试', 'exam',     '考场以教务通知为准。示例数据。'),
      make(shift(21), '示例 · 社团分享会',   'other',    '示例数据。')
    ];
  }

  /* =====================================================================
   * 2. 状态 + 渲染
   * ===================================================================== */
  const state = {
    // 当前显示的年月：锚定在当月 1 日，翻月时只改月份
    view: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
    selected: isoDate(new Date()),
    events: []
  };

  const $ = id => document.getElementById(id);
  const el = {
    title: $('title'), weekdays: $('weekdays'), grid: $('grid'), legend: $('legend'),
    detailDate: $('detail-date'), detailCount: $('detail-count'),
    detailList: $('detail-list'), detailEmpty: $('detail-empty'),
    form: $('form'), fDate: $('f-date'), fType: $('f-type'), fLevel: $('f-level'), formHint: $('form-hint')
  };

  /** 日期 → 事件数组索引，翻月/重渲染都是 O(1) 查表，不做线性筛选。 */
  function indexByDate(events) {
    const map = new Map();
    for (const ev of events) {
      const list = map.get(ev.date);
      if (list) list.push(ev); else map.set(ev.date, [ev]);
    }
    // 同一天内按等级从高到低排，最重要的先出现
    for (const list of map.values()) list.sort((a, b) => (b.level - a.level) || a.title.localeCompare(b.title, 'zh-CN'));
    return map;
  }

  /** 标准月历网格：按周一开头，补足 6 行 × 7 列，处理首日偏移与跨月日期。 */
  function buildCells(view) {
    const year = view.getFullYear();
    const month = view.getMonth();
    const first = new Date(year, month, 1);
    // getDay(): 周日=0 → 转成周一=0 的偏移
    const offset = (first.getDay() + 6) % 7;
    const start = new Date(year, month, 1 - offset);
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      cells.push({ date, iso: isoDate(date), inMonth: date.getMonth() === month });
    }
    return cells;
  }

  function render() {
    const map = indexByDate(state.events);
    const year = state.view.getFullYear();
    const month = state.view.getMonth();
    el.title.textContent = year + ' 年 ' + (month + 1) + ' 月';

    // 星期表头（只建一次）
    if (!el.weekdays.childElementCount) {
      WEEKDAYS.forEach((name, i) => {
        const span = document.createElement('span');
        span.textContent = name;
        if (i > 4) span.className = 'weekend';
        el.weekdays.appendChild(span);
      });
    }

    const todayIso = isoDate(new Date());
    const frag = document.createDocumentFragment();
    for (const cell of buildCells(state.view)) {
      const events = map.get(cell.iso) || [];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day' + (cell.inMonth ? '' : ' outside') + (cell.iso === todayIso ? ' today' : '') + (cell.iso === state.selected ? ' selected' : '');
      btn.dataset.date = cell.iso;
      if (events.length) btn.dataset.level = String(Math.max.apply(null, events.map(e => e.level)));
      btn.setAttribute('aria-label', cell.date.getDate() + '日' + (events.length ? '，' + events.length + ' 项事件' : '，无事件'));

      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(cell.date.getDate());
      btn.appendChild(num);

      const marks = document.createElement('div');
      marks.className = 'marks';
      events.slice(0, 2).forEach(ev => {
        const span = document.createElement('span');
        span.className = 'mark';
        span.textContent = ev.title;
        marks.appendChild(span);
      });
      if (events.length > 2) {
        const more = document.createElement('span');
        more.className = 'more';
        more.textContent = '+' + (events.length - 2);
        marks.appendChild(more);
      }
      btn.appendChild(marks);
      frag.appendChild(btn);
    }
    el.grid.replaceChildren(frag);
    renderDetail();
  }

  function renderDetail() {
    const date = parseIso(state.selected);
    el.detailDate.textContent = (date.getMonth() + 1) + ' 月 ' + date.getDate() + ' 日 · 周' + WEEKDAYS[(date.getDay() + 6) % 7];
    const events = state.events.filter(ev => ev.date === state.selected)
      .sort((a, b) => (b.level - a.level) || a.title.localeCompare(b.title, 'zh-CN'));
    el.detailCount.textContent = events.length ? events.length + ' 项' : '';
    el.detailEmpty.hidden = events.length > 0;

    const frag = document.createDocumentFragment();
    for (const ev of events) {
      const li = document.createElement('li');
      li.className = 'ev';
      li.dataset.level = String(ev.level);

      const strong = document.createElement('strong');
      strong.textContent = ev.title;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = LEVEL_TEXT[ev.level] + ' · ' + TYPES[ev.type].label;
      li.append(strong, meta);

      if (ev.desc) {
        const p = document.createElement('p');
        p.textContent = ev.desc;
        li.appendChild(p);
      }

      const foot = document.createElement('div');
      foot.className = 'ev-foot';
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'danger';
      del.dataset.delete = ev.id;
      del.textContent = '删除';
      foot.appendChild(del);
      li.appendChild(foot);
      frag.appendChild(li);
    }
    el.detailList.replaceChildren(frag);
  }

  function renderLegend() {
    const frag = document.createDocumentFragment();
    for (const key of Object.keys(TYPES)) {
      const item = document.createElement('span');
      const swatch = document.createElement('i');
      swatch.style.background = TYPES[key].color;
      item.append(swatch, document.createTextNode(TYPES[key].label + '（等级 ' + TYPES[key].level + '）'));
      frag.appendChild(item);
    }
    el.legend.replaceChildren(frag);
  }

  /* =====================================================================
   * 3. 持久化：任何写操作都先落盘再重渲染
   * ===================================================================== */
  function persist(nextEvents) {
    state.events = nextEvents;
    const ok = Storage.save(nextEvents);
    el.formHint.textContent = ok ? '' : '保存到本地失败，数据只在本次会话有效';
    render();
  }

  function addEvent(input) {
    /** @type {EventItem} */
    const event = {
      id: uid(),
      date: input.date,
      title: input.title.trim(),
      type: TYPES[input.type] ? input.type : 'other',
      level: Number(input.level) >= 1 && Number(input.level) <= 4 ? Number(input.level) : 1,
      desc: (input.desc || '').trim(),
      createdAt: new Date().toISOString()
    };
    persist(state.events.concat(event));
    return event;
  }

  function removeEvent(id) {
    persist(state.events.filter(ev => ev.id !== id));
  }

  function moveMonth(delta) {
    // 用 (year, month+delta, 1) 构造，跨年自动进位；只动 view，不动数据
    state.view = new Date(state.view.getFullYear(), state.view.getMonth() + delta, 1);
    render();
  }

  /* =====================================================================
   * 4. 交互绑定
   * ===================================================================== */
  $('prev').addEventListener('click', () => moveMonth(-1));
  $('next').addEventListener('click', () => moveMonth(1));
  $('today').addEventListener('click', () => {
    const now = new Date();
    state.view = new Date(now.getFullYear(), now.getMonth(), 1);
    state.selected = isoDate(now);
    render();
  });

  el.grid.addEventListener('click', e => {
    const btn = e.target.closest('.day');
    if (!btn) return;
    state.selected = btn.dataset.date;
    // 点到上/下月的日期时，顺带把视图翻到那个月，避免「选了看不见的日子」
    const picked = parseIso(btn.dataset.date);
    if (picked.getMonth() !== state.view.getMonth() || picked.getFullYear() !== state.view.getFullYear()) {
      state.view = new Date(picked.getFullYear(), picked.getMonth(), 1);
    }
    render();
  });

  el.detailList.addEventListener('click', e => {
    const btn = e.target.closest('[data-delete]');
    if (btn) removeEvent(btn.dataset.delete);
  });

  el.fType.appendChild(new Option('报名截止', 'deadline'));
  el.fType.appendChild(new Option('比赛日', 'match'));
  el.fType.appendChild(new Option('考试 / 提交', 'exam'));
  el.fType.appendChild(new Option('一般事项', 'other'));

  el.fType.addEventListener('change', () => {
    // 选类型自动带出推荐等级，用户仍可手动覆盖
    const type = TYPES[el.fType.value] || TYPES.other;
    el.fLevel.value = String(type.level);
  });

  el.form.addEventListener('submit', e => {
    e.preventDefault();
    const data = new FormData(el.form);
    const input = {
      date: String(data.get('date') || ''),
      title: String(data.get('title') || ''),
      type: String(data.get('type') || 'other'),
      level: String(data.get('level') || '1'),
      desc: String(data.get('desc') || '')
    };
    if (!input.date || !input.title.trim()) { el.formHint.textContent = '日期与标题必填'; return; }
    const created = addEvent(input);
    state.selected = created.date;
    const picked = parseIso(created.date);
    state.view = new Date(picked.getFullYear(), picked.getMonth(), 1);
    el.form.reset();
    el.fDate.value = state.selected;
    el.fType.value = 'deadline';
    el.fLevel.value = '4';
    el.formHint.textContent = '已保存';
    render();
  });

  /* =====================================================================
   * 5. 启动：读本地数据，首次则写入示例数据
   * ===================================================================== */
  function boot() {
    const stored = Storage.load();
    if (stored && stored.length) {
      state.events = stored;
    } else {
      state.events = sampleEvents();
      Storage.save(state.events);
    }
    state.selected = isoDate(new Date());
    el.fDate.value = state.selected;
    el.fType.value = 'deadline';
    el.fLevel.value = '4';
    renderLegend();
    render();
  }

  // 多标签页同步：另一个标签改了数据，这边刷新视图
  window.addEventListener('storage', e => {
    if (e.key !== STORAGE_KEY) return;
    const stored = Storage.load();
    if (stored) { state.events = stored; render(); }
  });

  // 可复用：挂到别的容器上时暴露最小 API
  window.SemesterCalendar = { addEvent, removeEvent, getEvents: () => state.events.slice(), storage: Storage };

  boot();
})();
</script>
</body>
</html>
